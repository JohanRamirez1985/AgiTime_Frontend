<div class="productos-card">
  <!-- Encabezado: botón crear -->
  <div class="encabezado-card">
    <h2>Gestión de usuarios</h2>
    <button mat-raised-button color="accent" [routerLink]="['/admin/usuarios/crear']">
      <mat-icon>person_add</mat-icon> Crear usuario
    </button>
  </div>

  <!-- Formulario de filtros -->
  <form class="filtros" (ngSubmit)="consultarUsuarios()">
    <div class="filtros-grid">
      <mat-form-field appearance="outline">
        <mat-label>Buscar por nombre</mat-label>
        <input matInput [(ngModel)]="filtro" name="filtro" placeholder="Nombre o correo"
          (ngModelChange)="filtrarUsuarios($event)" />
      </mat-form-field>

    </div>
  </form>

  <div class="tabla-container" *ngIf="!isMobileView">
    <app-table *ngIf="!isMobileView" [data]="usuariosFiltrados" [columns]="columnas" [actions]="acciones"
      [loading]="loading">
    </app-table>
  </div>

  <!-- Vista tipo tarjetas en móvil -->
  <div *ngIf="isMobileView" class="productos-cards">
    <mat-card *ngFor="let user of usuariosFiltrados" class="producto-card mat-elevation-z4">
      <h3>{{ user.nombre }}</h3>
      <p><strong>Rol:</strong> {{ user.nombreRol }}</p>
      <p><strong>Estado:</strong> {{ user.estado }}</p>
      <p><strong>Telefono:</strong> {{ user.telefono }}</p>
      <p><strong>Identificacion:</strong> {{ user.documento }}</p>
      <p><strong>Sede:</strong> {{ user.nombreSede }}</p>
      <p><strong>Recurso:</strong> {{ user.recurso ? 'Si' : 'No' }}</p>
      <div class="acciones-cell">
        <button mat-icon-button color="accent" (click)="editarProducto(user)">
          <mat-icon>edit</mat-icon>
        </button>
      </div>
    </mat-card>
  </div>
</div>
