<mat-card class="form-container">
  <h2><mat-icon>person_add</mat-icon> Registro de Usuario</h2>

  <form (ngSubmit)="registrarUsuario()" class="form-grid">

    <!-- Nombre -->
    <mat-form-field appearance="outline">
      <mat-label>Nombre completo</mat-label>
      <input matInput [(ngModel)]="usuario.nombre" name="nombre" required>
    </mat-form-field>

    <!-- Tipo de Documento -->
    <mat-form-field appearance="outline">
      <mat-label>Tipo de documento</mat-label>
      <mat-select [(ngModel)]="usuario.tipoDocumento" name="tipoDocumento">
        <mat-option *ngFor="let tipo of tipoDocumentos" [value]="tipo.id">{{ tipo.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Documento -->
    <mat-form-field appearance="outline">
      <mat-label>Número de documento</mat-label>
      <input matInput [(ngModel)]="usuario.documento" name="documento">
    </mat-form-field>

    <!-- Fecha Nacimiento -->
    <mat-form-field appearance="outline">
      <mat-label>Fecha de nacimiento</mat-label>
      <input matInput [matDatepicker]="picker" [(ngModel)]="usuario.fechaNacimiento" name="fechaNacimiento">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <!-- Teléfono -->
    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput type="tel" [(ngModel)]="usuario.telefono" name="telefono">
    </mat-form-field>
    
    <!-- Género -->
    <mat-form-field appearance="outline">
      <mat-label>Género</mat-label>
      <mat-select [(ngModel)]="usuario.genero" name="genero">
        <mat-option *ngFor="let genero of listaGeneros" [value]="genero.id">{{ genero.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Correo -->
    <mat-form-field appearance="outline">
      <mat-label>Correo</mat-label>
      <input matInput type="email" [(ngModel)]="usuario.correo" name="correo" autocomplete="off" required>
    </mat-form-field>

    <!-- Contraseña -->
    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" [(ngModel)]="usuario.password" name="password" autocomplete="off" required>
    </mat-form-field> 

    <!-- Sede -->
    <mat-form-field appearance="outline">
      <mat-label>Sede</mat-label>
      <mat-select [(ngModel)]="usuario.sede" name="sede">
        <mat-option *ngFor="let sede of listaSedes" [value]="sede.id">{{ sede.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Rol -->
    <mat-form-field appearance="outline">
      <mat-label>Rol</mat-label>
      <mat-select [(ngModel)]="usuario.rol" name="rol">
        <mat-option *ngFor="let rol of listaRoles" [value]="rol.id">{{ rol.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Botón -->
    <div class="boton-container">
      <button mat-raised-button color="primary" type="submit">
        <mat-icon>save</mat-icon> Guardar
      </button>
      <button mat-raised-button color="warn" type="button" (click)="cancelar()">
        <mat-icon>cancel</mat-icon> Cancelar
      </button>
    </div>
  </form>
</mat-card>
