<div class="tabla-container">
  <!-- 🔹 Loading -->
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>
    <p class="loading-text">Cargando disponibilidad...</p>
  </div>

  <!-- 🔹 Tabla -->
  <div *ngIf="!loading">
    <table mat-table [dataSource]="dataSource" class="custom-table">

      <!-- Generamos dinámicamente las columnas -->
      <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
        <th mat-header-cell *matHeaderCellDef> {{ col.label }} </th>
        <td mat-cell *matCellDef="let element"> {{ element[col.key] }} </td>
      </ng-container>

      <!-- Columna de acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let element">
          <ng-container *ngFor="let action of actions">
            <button mat-icon-button 
                    [color]="action.color || 'primary'"
                    [matTooltip]="action.tooltip || action.label"
                    (click)="action.action(element)">
              <mat-icon>{{ action.icon }}</mat-icon>
            </button>
          </ng-container>
        </td>
      </ng-container>

      <!-- Encabezados -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <!-- Filas -->
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Paginador (opcional) -->
    <!-- 
    <mat-paginator 
      [pageSizeOptions]="[5, 10, 20]" 
      showFirstLastButtons>
    </mat-paginator> 
    -->
  </div>
</div>
