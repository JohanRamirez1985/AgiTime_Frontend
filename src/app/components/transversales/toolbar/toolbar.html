<mat-toolbar color="primary" class="toolbar">
  <div class="user-info">
    <img [src]="img" alt="Foto de usuario" class="user-avatar" />
    <span class="user-text">{{ nombreEmpresa }}</span>
    <span class="user-subtext">{{ usuarioLogueado.nombre }}</span>
  </div>
  <!-- Spacer -->
  <span class="spacer"></span>

  <!-- Botones en pantallas grandes -->
  <div class="toolbar-buttons desktop-only">
    <button *ngIf="validate('das')" mat-button routerLink="/admin/dashboard">
      <mat-icon>dashboard</mat-icon>
      Ir al Dashboard
    </button>
    <button *ngIf="validate('ser')" mat-button routerLink="/admin/servicios">
      <mat-icon>home_repair_service</mat-icon>
      Servicios
    </button>
    <button *ngIf="validate('age')" mat-button routerLink="/admin/recurso/dash">
      <mat-icon>date_range</mat-icon>
      Agendamientos
    </button>
    <button *ngIf="validate('usu')" mat-button routerLink="/admin/usuarios">
      <mat-icon>people</mat-icon>
      Usuarios
    </button>
    <button
      *ngIf="validate('edu')"
      mat-button
      routerLink="/admin/usuarioPorcentaje/gestionar"
    >
      <mat-icon>people</mat-icon>
      Usuarios
    </button>
    <button *ngIf="validate('pro')" mat-button routerLink="/admin/inventario">
      <mat-icon>store</mat-icon>
      Inventario
    </button>
    <button *ngIf="validate('ven')" mat-button routerLink="/admin/venta">
      <mat-icon>attach_money</mat-icon>
      Venta
    </button>
    <button *ngIf="validate('inf')" mat-button routerLink="/admin/informes">
      <mat-icon>bar_chart</mat-icon>
      Informes
    </button>
    <button mat-button class="logout-button" (click)="cerrarSesion()">
      <mat-icon>logout</mat-icon>
      Cerrar sesión
    </button>

    <mat-menu #userMenu="matMenu">
      <div style="padding: 8px 16px; font-weight: bold">
        {{ usuarioLogueado.nombre }}
      </div>
      <mat-divider></mat-divider>
      <div style="padding: 8px 16px; font-weight: bold">
        {{ usuarioLogueado?.nombreRol || "Rol" }}
      </div>
    </mat-menu>
  </div>

  <!-- Menú hamburguesa en móviles -->
  <button mat-icon-button class="mobile-only" [matMenuTriggerFor]="menu">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button *ngIf="validate('das')" mat-menu-item routerLink="/admin/dashboard">
      <mat-icon>dashboard</mat-icon>
      Ir al Dashboard
    </button>
    <button *ngIf="validate('ser')" mat-menu-item routerLink="/admin/servicios">
      <mat-icon>home_repair_service</mat-icon>
      Servicos
    </button>
    <button
      *ngIf="validate('age')"
      mat-menu-item
      routerLink="/admin/recurso/dash"
    >
      <mat-icon>date_range</mat-icon>
      Agendamientos
    </button>
    <button *ngIf="validate('usu')" mat-menu-item routerLink="/admin/usuarios">
      <mat-icon>people</mat-icon>
      Usuarios
    </button>
    <button
      *ngIf="validate('edu')"
      mat-menu-item
      routerLink="/admin/usuarioPorcentaje/gestionar"
    >
      <mat-icon>people</mat-icon>
      Usuarios
    </button>
    <button
      *ngIf="validate('pro')"
      mat-menu-item
      routerLink="/admin/inventario"
    >
      <mat-icon>store</mat-icon>
      Inventario
    </button>
    <button *ngIf="validate('ven')" mat-menu-item routerLink="/admin/venta">
      <mat-icon>attach_money</mat-icon>
      Venta
    </button>
    <button *ngIf="validate('inf')" mat-menu-item routerLink="/admin/informes">
      <mat-icon>bar_chart</mat-icon>
      Informes
    </button>
    <button mat-menu-item (click)="cerrarSesion()">
      <mat-icon>logout</mat-icon>
      Cerrar sesión
    </button>
  </mat-menu>
</mat-toolbar>
