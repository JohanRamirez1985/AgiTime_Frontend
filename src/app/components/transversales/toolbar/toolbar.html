<mat-sidenav-container class="sidenav-container">

  <!-- =====================================================
       MENÚ LATERAL
  ====================================================== -->

  <mat-sidenav #sidenav class="sidenav" [mode]="isMobileView ? 'over' : 'side'" [opened]="!isMobileView">

    <!-- Encabezado azul -->
    <div class="sidenav-header">

      <img [src]="img" alt="Foto de usuario" class="sidenav-avatar" />

      <div class="sidenav-user">

        <div class="empresa">
          {{ nombreEmpresa }}
        </div>

        <div class="usuario">
          {{ usuarioLogueado.nombre }}
        </div>

      </div>

    </div>


    <!-- =====================================================
         OPCIONES DEL MENÚ
    ====================================================== -->

    <mat-nav-list>

      <ng-container *ngFor="let item of menuItems">

        <a mat-list-item *ngIf="validate(item.codigo)" [routerLink]="item.route" routerLinkActive="active-menu"
          [routerLinkActiveOptions]="{ exact: true }" (click)="isMobileView && sidenav.close()">

          <mat-icon matListItemIcon>
            {{ item.icon }}
          </mat-icon>

          <span matListItemTitle>
            {{ item.label }}
          </span>

        </a>

      </ng-container>

    </mat-nav-list>

  </mat-sidenav>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
  ====================================================== -->

  <mat-sidenav-content>


    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <mat-toolbar class="toolbar">

      <!-- Botón menú -->
      <button mat-icon-button class="menu-button" (click)="toggleMenu(sidenav)" aria-label="Abrir menú">

        <mat-icon>
          menu
        </mat-icon>

      </button>


      <!-- Empresa + usuario -->

      <div class="toolbar-company" *ngIf="!sidenav.opened">

        <img [src]="img" alt="Logo empresa" class="toolbar-logo" />

        <div class="toolbar-company-data">

          <span class="toolbar-company-name">
            {{ nombreEmpresa }}
          </span>

          <span class="toolbar-user-name">
            {{ usuarioLogueado?.nombre }}
          </span>

        </div>

      </div>


      <!-- Espacio -->

      <span class="spacer"></span>


      <!-- Cerrar sesión -->

      <button mat-button class="logout-toolbar" (click)="cerrarSesion()">

        <mat-icon>
          logout
        </mat-icon>

        <span class="logout-text">
          Cerrar sesión
        </span>

      </button>

    </mat-toolbar>


    <!-- =====================================================
         CONTENIDO DE LAS RUTAS
    ====================================================== -->

    <div class="content">

      <router-outlet></router-outlet>

    </div>


  </mat-sidenav-content>

</mat-sidenav-container>
