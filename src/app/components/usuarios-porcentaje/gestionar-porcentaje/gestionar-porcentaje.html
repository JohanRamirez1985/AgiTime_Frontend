<mat-card>
  <h2>Gestion de usuarios</h2>
  <!-- Formulario de filtros -->
  <form class="filtros" (ngSubmit)="consultarUsuarios()">
    <div class="filtros-grid">
      <mat-form-field appearance="outline">
        <mat-label>Buscar por nombre</mat-label>
        <input matInput [(ngModel)]="filtro" name="filtro" placeholder="Nombre o correo" (ngModelChange)="filtrarUsuarios($event)" />
      </mat-form-field>

    </div>
  </form>

  <app-table 
    *ngIf="!isMobileView"
    [data]="usuariosFiltrados" 
    [columns]="columnas"
    [actions]="acciones"
    [loading]="loading">
  </app-table>


   <!-- Vista tipo tarjetas en móvil -->
  <div *ngIf="isMobileView" class="productos-cards">
    <mat-card *ngFor="let user of usuariosFiltrados" class="producto-card mat-elevation-z4">
      <h3>{{ user.nombre }}</h3>
      <p><strong>Estado:</strong> {{ user.estado }}</p>
      <p><strong>Telefono:</strong> {{ user.telefono }}</p>
      <p><strong>Identificacion:</strong> {{ user.documento }}</p>
      <p><strong>Sede:</strong> {{ user.nombreSede }}</p>
      <div class="acciones-cell">
        <button mat-icon-button color="accent" (click)="editarElemento(user)">
          <mat-icon>edit</mat-icon>
        </button>
      </div>
    </mat-card>
  </div>
</mat-card>
