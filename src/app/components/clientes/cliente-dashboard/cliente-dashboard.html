<div class="dashboard-wrapper">
  <mat-card class="dashboard-card mat-elevation-z8">
    <!-- Botón de cerrar sesión en la esquina superior derecha -->
    <div class="logout-top-right">
      <button mat-icon-button color="warn" (click)="cerrarSesion()" matTooltip="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </div>

    <!-- Título -->
    <h2 class="title">👋 Bienvenido, {{ nombreEmpresa }}</h2>
    <mat-divider></mat-divider>
     <img [src]="img" alt="Imagen barbería" class="imagen-banner" />

    <!-- Lista de recursos -->
    <div class="recurso-lista">
      <mat-card
        *ngFor="let usuario of recursos"
        class="recurso-card mat-elevation-z2"
        (click)="irAReservar(usuario)"
      >
        <div class="recurso-content">
          <div class="recurso-info">
            <h3>{{ usuario.nombre }}</h3>
            <p><mat-icon>email</mat-icon> {{ usuario.correo }}</p>
            <p><mat-icon>phone</mat-icon> {{ usuario.telefono }}</p>
            <p><mat-icon>badge</mat-icon> {{ usuario.nombreSede }}</p>
          </div>
          <div class="recurso-imagen">
            <img src="assets/img/default-user.png" alt="Foto de {{ usuario.nombre }}" />
          </div>
        </div>
      </mat-card>
    </div>
  </mat-card>
</div>
