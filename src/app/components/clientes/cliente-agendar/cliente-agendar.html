<div class="agendar-wrapper">
  <div class="header-container">
    <button mat-icon-button color="primary" (click)="volver()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="header-title">Inicio</span>
  </div>
  <h2><mat-icon>event</mat-icon> Agendar cita</h2>

  <!-- Recurso -->
  <!-- <mat-card class="card-recurso mat-elevation-z4">
    <mat-card-content class="contenido-recurso">
      <img [src]="fotoRecuerso" alt="Recurso" class="imagen-recurso" />
      <div class="info-recurso">
        <div class="recurso-nombre">
          <mat-icon color="primary">check_circle</mat-icon>
          <span class="texto-recurso">{{ nombreDelRecurso }}</span>
        </div>
          <small class="subtexto-recurso">Recurso asignado para tu cita</small>
      </div>
    </mat-card-content>
  </mat-card> -->

  <mat-card class="card-recurso mat-elevation-z4">
    <mat-card-content class="contenido-recurso">
      <img [src]="fotoRecuerso" alt="Recurso" class="imagen-recurso" />
      <div class="info-recurso">
        <div class="recurso-nombre">
          <mat-icon color="primary">check_circle</mat-icon>
          <span class="texto-recurso">{{ nombreDelRecurso }}</span>
        </div>
        
        <ul class="subtexto-recurso-lista" *ngIf="mostrarDetalle">
          <li *ngFor="let detalle of detallesRecurso">{{ detalle }}</li>
        </ul>

      </div>
    </mat-card-content>
  </mat-card>

  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>
    <p class="loading-text">Cargando disponibilidad...</p>
  </div>

  <div class="servicios-wrapper" *ngIf="mostrarServicios">
    <h2 class="titulo">Servicios</h2>

    <div class="servicios-container">
      <mat-card
        class="servicio-card"
        *ngFor="let servicio of serviciosFiltrados"
        [class.selected]="estaSeleccionado(servicio)"
      >
        <div class="contenido-servicio">
          <div class="servicio-info">
            <div class="servicio-nombre">{{ servicio.nombre }}</div>
            <div class="servicio-precio">${{ servicio.valor | number: '1.0-0':'es-CO' }}</div>
          </div>
          <button
            mat-mini-fab
            color="primary"
            class="boton-add"
            (click)="toggleSeleccionServicio(servicio)"
          >
            <mat-icon>{{ estaSeleccionado(servicio) ? 'check' : 'add' }}</mat-icon>
          </button>
        </div>
      </mat-card>
    </div>

    <!-- Botón flotante visible solo si hay servicios seleccionados -->
    <div *ngIf="serviciosSeleccionados.length > 0" class="boton-flotante-wrapper">
      <button
        mat-flat-button
        color="primary"
        class="boton-flotante-mejorado"
        (click)="reservarServicios()"
      >
        Reservar ({{ serviciosSeleccionados.length }})
      </button>
    </div>
  </div>

  <!-- Navegación de fechas -->
  <div *ngIf="mostrarDisponibilidad">
    <div class="barra-fecha">
      <span class="fecha-actual">
        <mat-icon>calendar_today</mat-icon> {{ viewDate | date: 'fullDate' }}
      </span>
      <div class="navegacion-botones">
        <button mat-stroked-button color="primary" (click)="today()">Hoy</button>
        <button mat-icon-button (click)="nextPeriod()" aria-label="Día siguiente">
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </div>

    <!-- Horarios -->
    <div class="horarios-container" *ngIf="!loading">

      <!-- Mañana -->
      <div class="horario-seccion">
        <div class="seccion-titulo">
          <mat-icon>light_mode</mat-icon> Mañana (AM)
        </div>
        <div class="horas-grid">
          <button
            mat-flat-button
            *ngFor="let hora of horasAM"
            [disabled]="!hora.disponible"
            [ngClass]="{
              'hora-disponible': hora.disponible,
              'hora-no-disponible': !hora.disponible
            }"
            (click)="seleccionarHora(hora)"
          >
            {{ hora.hora }}
          </button>
        </div>
      </div>

      <!-- Tarde -->
      <div class="horario-seccion">
        <div class="seccion-titulo">
          <mat-icon>nights_stay</mat-icon> Tarde (PM)
        </div>
        <div class="horas-grid">
          <button
            mat-flat-button
            *ngFor="let hora of horasPM"
            [disabled]="!hora.disponible"
            [ngClass]="{
              'hora-disponible': hora.disponible,
              'hora-no-disponible': !hora.disponible
            }"
            (click)="seleccionarHora(hora)"
          >
            {{ hora.hora }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
