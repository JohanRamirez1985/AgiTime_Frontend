<div class="agendar-wrapper">
  <h2>📅 Agendar cita</h2>

  <mat-form-field class="full-width recurso-display" appearance="outline">
    <mat-label>Recurso seleccionado</mat-label>
    <input matInput [value]="nombreDelRecurso" disabled  class="recurso-texto"/>
    <mat-icon matSuffix color="primary">check_circle</mat-icon>
  </mat-form-field>

  <mat-form-field class="full-width servicio-multiple" appearance="outline">
    <mat-label>Servicios disponibles</mat-label>
    <mat-select
      [(ngModel)]="serviciosSeleccionados"
      multiple
      [disabled]="serviciosFiltrados.length === 0"
    >
      <mat-option
        *ngFor="let servicio of serviciosFiltrados"
        [value]="servicio.id"
      >
        {{ servicio.nombre }}
      </mat-option>
    </mat-select>
  </mat-form-field>





</div>
