<div class="productos-card">
  <h2>Recordatorio clientes</h2>
  <!-- Formulario de filtros -->

  <div class="filtros-container">

    <mat-form-field appearance="outline">
      <mat-label>Tipo de recordatorio</mat-label>
      <mat-select name="tipo" [(ngModel)]="tipo" required>
        <mat-option [value]="1">Clientes que no han vuelto a asistir</mat-option>
        <mat-option [value]="2">Clientes registrados sin citas</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Días sin asistir</mat-label>
      <input matInput type="number" name="dias" [(ngModel)]="dias" min="1" step="1" required placeholder="Ej. 15" />
    </mat-form-field>

    <button mat-flat-button color="primary" type="submit" (click)="consultar()" [disabled]="btnConsultar || loading">
      <mat-icon>search</mat-icon>
      Consultar
    </button>

  </div>

  <form class="filtros">
    <div class="filtros-grid">
      <mat-form-field appearance="outline">
        <mat-label>Buscar por nombre</mat-label>
        <input matInput [(ngModel)]="filtro" name="filtro" placeholder="Nombre"
          (ngModelChange)="filtrarCliente($event)" />
      </mat-form-field>
    </div>
  </form>


  <app-table *ngIf="!isMobileView" [data]="clienteRecordatorioFiltrados" [columns]="columnas" [actions]="acciones"
    [loading]="loading">
  </app-table>


  <!-- Vista tipo tarjetas en móvil -->
  <div *ngIf="isMobileView" class="productos-cards">
    <mat-card *ngFor="let cli of clienteRecordatorioFiltrados" class="producto-card mat-elevation-z4">

      <h3>{{ cli.nombre }}</h3>

      <p *ngIf="tipo === 1">
        <strong>Fecha última visita:</strong>
        {{ cli.ultimaFechaAsistio }}
      </p>

      <p *ngIf="tipo === 2">
        <strong>Fecha de registro:</strong>
        {{ cli.FechaCreacion }}
      </p>

      <div class="acciones-cell">
        <button mat-icon-button class="btn-whatsapp" aria-label="Enviar recordatorio por WhatsApp"
          (click)="envioMensaje(cli)">

          <img src="assets/img/whatsapp.svg" alt="WhatsApp" class="icono-whatsapp">

        </button>
      </div>

    </mat-card>
  </div>
</div>
