<div class="productos-card">
  <h2>Recordatorio clientes</h2>
  <!-- Formulario de filtros -->

<div class="filtros-container">

  <mat-form-field appearance="outline">
    <mat-label>Días sin asistir</mat-label>
    <input
      matInput
      type="number"
      name="dias"
      [(ngModel)]="dias"
      min="1"
      step="1"
      required
      placeholder="Ej. 15"
    />
  </mat-form-field>

  <button
    mat-flat-button
    color="primary"
    type="submit"
    (click)="consultar()"
    [disabled]="btnConsultar || loading">
    <mat-icon>search</mat-icon>
    Consultar
  </button>

</div>

<form class="filtros">
  <div class="filtros-grid">
    <mat-form-field appearance="outline">
      <mat-label>Buscar por nombre</mat-label>
      <input
        matInput
        [(ngModel)]="filtro"
        name="filtro"
        placeholder="Nombre"
        (ngModelChange)="filtrarCliente($event)"
      />
    </mat-form-field>
  </div>
</form>


  <app-table 
    *ngIf="!isMobileView"
    [data]="clienteRecordatorioFiltrados" 
    [columns]="columnas"
    [actions]="acciones"
    [loading]="loading">
  </app-table>


   <!-- Vista tipo tarjetas en móvil -->
  <div *ngIf="isMobileView" class="productos-cards">
    <mat-card *ngFor="let cli of clienteRecordatorioFiltrados" class="producto-card mat-elevation-z4">
      <h3>{{ cli.nombre }}</h3>
      <p><strong>fecha ultima visita:</strong> {{ cli.ultimaFechaAsistio }}</p>
      <div class="acciones-cell">
        <button mat-icon-button color="accent" (click)="envioMensaje(cli)">
        </button>
      </div>
    </mat-card>
  </div>
</div>
