<mat-card class="reporte-card">

  <!-- Título -->
  <mat-card-header>
    <mat-card-title>
      <mat-icon color="primary">bar_chart</mat-icon>
      Selección de Reporte
    </mat-card-title>
  </mat-card-header>

  <!-- Loading inicial -->
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>

    <p class="loading-text">
      Cargando tipos de reportes...
    </p>
  </div>

  <!-- Contenido -->
  <div *ngIf="!loading">

    <mat-card-content>

      <form [formGroup]="form" class="reporte-form">

        <!-- Tipo de reporte -->
        <mat-form-field appearance="outline" class="full-width">

          <mat-label>Tipo de Reporte</mat-label>

          <mat-select
            formControlName="tipo"
            (selectionChange)="onTipoChange($event.value)">

            <mat-option
              *ngFor="let tipo of tipos"
              [value]="tipo.id">

              {{ tipo.nombre }}

            </mat-option>

          </mat-select>

        </mat-form-field>

      </form>

      <!-- Loading del reporte -->
      <div *ngIf="loadingReporte" class="loading-container">

        <mat-spinner diameter="40"></mat-spinner>

        <p class="loading-text">
          Generando reporte...
        </p>

      </div>

    </mat-card-content>

  </div>

</mat-card>


<!-- Resultados -->
<div *ngIf="!loadingReporte">

  <!-- Barra de acciones -->
  <div class="tabla-header" *ngIf="datos.length > 0">

    <button
      mat-raised-button
      color="primary"
      (click)="exportarExcel()">

      <mat-icon>file_download</mat-icon>
      Exportar Excel

    </button>

  </div>

  <!-- Tabla -->
  <app-table
    [data]="datos"
    [columns]="columnas"
    [actions]="acciones"
    [loading]="loadingReporte">
  </app-table>

</div>
