<h2 mat-dialog-title>Editar venta</h2>

<mat-dialog-content>

  <div class="info">

    <p>
      <strong>Producto:</strong>
      {{data.producto}}
    </p>

    <p>
      <strong>Vendedor:</strong>
      {{data.vendedor}}
    </p>

    <p>
      <strong>Fecha:</strong>
      {{data.fechaVenta}}
    </p>

  </div>

  <form [formGroup]="form">

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Total venta</mat-label>

      <input matInput type="number" formControlName="venta">

    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Descuento</mat-label>

      <input matInput type="number" formControlName="descuento">

    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Comisión</mat-label>

      <input matInput type="number" formControlName="comision">

    </mat-form-field>

  </form>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button mat-button (click)="cancelar()">

    Cancelar

  </button>

  <button mat-flat-button color="primary" [disabled]="form.invalid || loading" (click)="guardar()">

    <mat-spinner *ngIf="loading" diameter="20">
    </mat-spinner>

    <span *ngIf="!loading">
      Guardar cambios
    </span>

  </button>

</mat-dialog-actions>
