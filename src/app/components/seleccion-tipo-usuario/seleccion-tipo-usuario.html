<div class="login-wrapper">
  <div class="login-card">
    <!-- Paso 1: Selección de tipo -->
    <ng-container *ngIf="!tipoSeleccionado">
      <h2>Selecciona tu tipo de usuario</h2>
      <div class="button-group">
        <button (click)="seleccionarTipo('empresa')">Soy una Empresa</button>
        <button (click)="seleccionarTipo('cliente')">Soy un Cliente</button>
      </div>
    </ng-container>

    <!-- Paso 2: Mostrar listado filtrado -->
    <ng-container *ngIf="tipoSeleccionado">
      <h2>Selecciona {{ tipoSeleccionado === 'empresa' ? 'una empresa' : 'un cliente' }}</h2>

      <input
        type="text"
        [(ngModel)]="filtro"
        placeholder="Buscar por nombre..."
        class="buscador"
      />

      <ul class="listado">
        <li *ngFor="let item of listadoFiltrado()" (click)="irALogin(item)">
          {{ item.nombre }}
        </li>
        <li *ngIf="listadoFiltrado().length === 0">No se encontraron resultados.</li>
      </ul>

      <button class="btn-volver" (click)="cancelar()">Volver</button>
    </ng-container>
  </div>
</div>
