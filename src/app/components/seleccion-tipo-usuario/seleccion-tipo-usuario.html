<div class="login-wrapper">
  <mat-card class="login-card">

    <!-- Paso 1: Selección de tipo -->
    <ng-container *ngIf="idEmpresaSeleccionada">
      <h2>Selecciona tu tipo de usuario</h2>
      <div class="button-group">
        <button mat-raised-button color="primary" (click)="seleccionarTipo('empresa')">
          Soy una Empresa
        </button>
        <button mat-raised-button color="accent" (click)="seleccionarTipo('cliente')">
          Soy un Cliente
        </button>
      </div>
    </ng-container>

    <!-- Paso 2: Mostrar listado filtrado -->
    <ng-container *ngIf="!idEmpresaSeleccionada">
      <h2>Selecciona una empresa</h2>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Buscar por nombre...</mat-label>
        <input matInput [(ngModel)]="filtro" (ngModelChange)="buscarNombre()" />
      </mat-form-field>

      <mat-list class="listado" *ngIf="mostrarListado">
        <mat-list-item *ngFor="let item of listadoFiltrado()" (click)="seleccionarEmpresa(item)">
          {{ item.nombre }}
        </mat-list-item>
        <mat-list-item *ngIf="listadoFiltrado().length === 0">
          No se encontraron resultados.
        </mat-list-item>
      </mat-list>

      <button mat-stroked-button color="warn" (click)="cancelar()">Volver</button>
    </ng-container>

  </mat-card>
</div>
