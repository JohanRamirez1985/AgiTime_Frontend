<mat-card class="reporte-card">
  <mat-card-header>
    <mat-card-title>
      <mat-icon color="primary">bar_chart</mat-icon>
      Selección de Reporte
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" class="reporte-form">
      <!-- Selección tipo reporte -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Tipo de Reporte</mat-label>
        <mat-select
          formControlName="tipo"
          (selectionChange)="onTipoChange($event.value)"
        >
          <mat-option value="diario">Diario</mat-option>
          <mat-option value="semanal">Semanal</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Si es diario -->
      <div *ngIf="tipoReporte === 'diario'" class="campo-fecha">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Fecha</mat-label>
          <input
            matInput
            [matDatepicker]="pickerDiario"
            formControlName="fecha"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="pickerDiario"
          ></mat-datepicker-toggle>
          <mat-datepicker #pickerDiario></mat-datepicker>
        </mat-form-field>
      </div>

      <!-- Si es semanal -->
      <div *ngIf="tipoReporte === 'semanal'" class="rango-fechas">
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Fecha Inicial</mat-label>
          <input
            matInput
            [matDatepicker]="pickerInicio"
            formControlName="fechaInicio"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="pickerInicio"
          ></mat-datepicker-toggle>
          <mat-datepicker #pickerInicio></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Fecha Final</mat-label>
          <input
            matInput
            [matDatepicker]="pickerFin"
            formControlName="fechaFin"
          />
          <mat-datepicker-toggle
            matSuffix
            [for]="pickerFin"
          ></mat-datepicker-toggle>
          <mat-datepicker #pickerFin></mat-datepicker>
        </mat-form-field>
      </div>

      <!-- Botón -->
      <div class="btn-container">
        <button
          mat-raised-button
          color="primary"
          (click)="generarReporte()"
          [disabled]="form.invalid"
        >
          <mat-icon>analytics</mat-icon>
          Generar Reporte
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
