<div class="register-wrapper">
  <div class="register-card">
    <h2>Crear cuenta</h2>
    <form (ngSubmit)="registrar()" #registerForm="ngForm">
      <div class="form-group">
        <label for="name">Nombre completo</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="nombre"
          required
          minlength="3"
          #nameInput="ngModel"
        />
        <div *ngIf="nameInput.invalid && nameInput.touched">
          <small *ngIf="nameInput.errors?.['required']">El nombre es obligatorio.</small>
          <small *ngIf="nameInput.errors?.['minlength']">Debe tener al menos 3 caracteres.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          email
          #emailInput="ngModel"
        />
        <div *ngIf="emailInput.invalid && emailInput.touched">
          <small *ngIf="emailInput.errors?.['required']">El correo es obligatorio.</small>
          <small *ngIf="emailInput.errors?.['email']">Debe ser un correo válido.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          minlength="6"
          #passwordInput="ngModel"
        />
        <div *ngIf="passwordInput.invalid && passwordInput.touched">
          <small *ngIf="passwordInput.errors?.['required']">La contraseña es obligatoria.</small>
          <small *ngIf="passwordInput.errors?.['minlength']">Debe tener al menos 6 caracteres.</small>
        </div>
      </div>

      <button type="submit" [disabled]="registerForm.invalid">Registrar</button>
    </form>

    <div class="already-account">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </div>
  </div>
</div>
