<h2 mat-dialog-title>
  Listado de Productos
</h2>

<mat-dialog-content>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Buscar producto</mat-label>

    <input matInput placeholder="Nombre, código, categoría..." (keyup)="aplicarFiltro($event)" />

    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="contenedor-tabla">

    <table mat-table [dataSource]="dataSource" matSort class="tabla-productos">

      <!-- Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Nombre
        </th>

        <td mat-cell *matCellDef="let row">
          {{ row.nombre }}
        </td>
      </ng-container>

      <!-- Precio -->
      <ng-container matColumnDef="precioVenta">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Precio
        </th>

        <td mat-cell *matCellDef="let row">
          ${{ row.precioVenta | number:'1.0-0' }}
        </td>
      </ng-container>

      <!-- comision -->

      <ng-container matColumnDef="comision">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Comisión
        </th>

        <td mat-cell *matCellDef="let row">
          ${{ row.porcentaje | number:'1.0-0' }}
        </td>
      </ng-container>

      <!-- Stock -->
      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Stock
        </th>

        <td mat-cell *matCellDef="let row">
          {{ row.stock }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>

      <tr mat-row *matRowDef="let row; columns: columnas">
      </tr>

    </table>

  </div>

  <mat-paginator [pageSize]="10" [pageSizeOptions]="[5,10,20,50]" showFirstLastButtons>
  </mat-paginator>

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button mat-raised-button color="warn" mat-dialog-close>

    Cerrar

  </button>

</mat-dialog-actions>
