<div class="productos-card">
  <!-- Encabezado -->
  <div class="encabezado-card">
    <h2>Editar Producto</h2>
  </div>
  <div class="spinner-overlay" *ngIf="loading">
    <mat-spinner diameter="50"></mat-spinner>
  </div>
  <!-- Formulario -->
  <form [formGroup]="productoForm" (ngSubmit)="guardar()" class="form-container">
    
    <!-- Nombre -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput placeholder="Ingrese el nombre" formControlName="Nombre" required>
      <mat-error *ngIf="productoForm.get('Nombre')?.hasError('required')">
        El nombre es obligatorio
      </mat-error>
    </mat-form-field>

    <!-- Código (solo visual) -->
    <mat-label>Código</mat-label>
    <div class="campo-valor">{{ producto?.codigo }}</div>

    <!-- Precio -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Precio</mat-label>
      <input matInput type="number" placeholder="Ingrese el precio" formControlName="Precio" required>
      <mat-error *ngIf="productoForm.get('Precio')?.hasError('required')">
        El precio es obligatorio
      </mat-error>
    </mat-form-field>

    <!-- Botones -->
    <div class="acciones-header">
      <button mat-raised-button color="primary" type="submit" [disabled]="productoForm.invalid">
        <mat-icon>save</mat-icon>
        Guardar
      </button>
      <button mat-button color="warn" type="button" (click)="cancelar()">
        <mat-icon>cancel</mat-icon>
        Cancelar
      </button>
    </div>

  </form>
</div>
