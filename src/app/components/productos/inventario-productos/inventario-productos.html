<div class="productos-card">
<ng-container *ngIf="!inactiva; else mensajeNoAutorizado">
  <!-- Encabezado con título y botón -->
  <div class="encabezado-card">
    <h2>Inventario de Productos</h2>
    <div class="acciones-header">
      <button mat-raised-button color="primary" (click)="crearProducto()">
        <mat-icon>add</mat-icon>
        Crear Producto
      </button>
    </div>
  </div>

  <!-- Contenedor de la tabla -->
  <div class="tabla-container" *ngIf="!isMobileView">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let producto"> {{ producto.nombre }} </td>
      </ng-container>

      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef> Codigo </th>
        <td mat-cell *matCellDef="let producto"> {{ producto.codigo }} </td>
      </ng-container>

      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef> Precio </th>
        <td mat-cell *matCellDef="let producto"> {{ '$' }} {{ producto.valor | number:'1.0-0' }} </td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef> Stock </th>
        <td mat-cell *matCellDef="let producto"> {{ producto.stock }} </td>
      </ng-container>

      <!-- Acciones -->
      <!--<ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let producto" class="acciones-cell">
          <button mat-icon-button color="accent" (click)="editarProducto(producto)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>-->

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>
  </div>

  <!-- Vista tipo tarjetas en móvil -->
  <div *ngIf="isMobileView" class="productos-cards">
    <mat-card *ngFor="let producto of dataSource.data" class="producto-card mat-elevation-z4">
      <h3>{{ producto.nombre }}</h3>
      <p><strong>Precio:</strong> {{ producto.precio | currency }}</p>
      <p><strong>Categoría:</strong> {{ producto.categoria }}</p>
      <div class="acciones-cell">
        <button mat-icon-button color="accent" (click)="editarProducto(producto)">
          <mat-icon>edit</mat-icon>
        </button>
      </div>
    </mat-card>
  </div>
  </ng-container>
  <ng-template #mensajeNoAutorizado>
    <div class="mensaje-error">
      <mat-icon color="warn">error</mat-icon>
      <p>{{ mensajeError }}</p>
    </div>
  </ng-template>
</div>
