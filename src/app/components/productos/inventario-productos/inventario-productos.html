<mat-card class="productos-card">

  <!-- Encabezado -->
  <div class="encabezado-card">
    <h2>Gestión de productos</h2>
    <button mat-raised-button color="accent" [routerLink]="['/admin/productos/crear']">
      <mat-icon>add</mat-icon> Crear producto
    </button>
  </div>

  <!-- Tabla (solo escritorio) -->
  <div class="tabla-container" *ngIf="!isMobileView">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

      <!-- Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let producto"> {{ producto.nombre }} </td>
      </ng-container>

      <!-- Categoría -->
      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef> Categoría </th>
        <td mat-cell *matCellDef="let producto"> {{ producto.categoria }} </td>
      </ng-container>

      <!-- Precio -->
      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef> Precio </th>
        <td mat-cell *matCellDef="let producto"> {{ producto.precio | currency:'USD':'symbol' }} </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let producto" class="acciones-cell">
          <a mat-stroked-button color="primary" [routerLink]="['/admin/productos/editar', producto.id]">
            <mat-icon>edit</mat-icon> Editar
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <!-- Paginador -->
    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]">
    </mat-paginator>
  </div>

  <!-- Cards (solo móvil) -->
  <div class="productos-cards" *ngIf="isMobileView">
    <mat-card *ngFor="let producto of dataSource.data" class="producto-card mat-elevation-z2">
      <h3>{{ producto.nombre }}</h3>
      <p><strong>Categoría:</strong> {{ producto.categoria }}</p>
      <p><strong>Precio:</strong> {{ producto.precio | currency:'USD':'symbol' }}</p>
      <a mat-raised-button color="primary" [routerLink]="['/admin/productos/editar', producto.id]">
        <mat-icon>edit</mat-icon> Editar
      </a>
    </mat-card>
  </div>
</mat-card>
