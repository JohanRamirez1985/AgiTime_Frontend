<div class="login-wrapper">
  <mat-card class="login-card">
    <h2>Iniciar sesión</h2>

    <app-error-message [message]="apiErrorMessage"></app-error-message>

    <form (ngSubmit)="login()" #loginForm="ngForm" autocomplete="off">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Usuario</mat-label>
        <input
          matInput
          type="email"
          name="user_email_{{ uniqueId }}"
          [(ngModel)]="email"
          required
          minlength="4"
          #emailInput="ngModel"
          autocomplete="off"
        />
        <mat-error *ngIf="emailInput.errors?.['required']"
          >El correo es obligatorio.</mat-error
        >
        <mat-error *ngIf="emailInput.errors?.['email']"
          >Debe ser un correo válido.</mat-error
        >
        <mat-error *ngIf="emailInput.errors?.['minlength']"
          >Debe tener al menos 4 caracteres.</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          type="password"
          name="user_pass_{{ uniqueId }}"
          [(ngModel)]="password"
          required
          minlength="6"
          #passwordInput="ngModel"
          autocomplete="new-password"
        />
        <mat-error *ngIf="passwordInput.errors?.['required']"
          >La contraseña es obligatoria.</mat-error
        >
        <mat-error *ngIf="passwordInput.errors?.['minlength']"
          >Debe tener al menos 6 caracteres.</mat-error
        >
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        class="full-width"
        [disabled]="loginForm.invalid || loading"
      >
        <span *ngIf="!loading">Ingresar</span>
        <mat-spinner
          *ngIf="loading"
          diameter="20"
          strokeWidth="3"
        ></mat-spinner>
      </button>
    </form>

    <div *ngIf="tipo === 'cl'" class="no-account">
      ¿No tienes cuenta?
      <a
        [routerLink]="['/register']"
        [queryParams]="{ em: idEmpresa, tipo: 'cl' }"
        >Crea una</a
      >
    </div>

    <app-error-message
      [message]="apiErrorMessage"
      [show]="showModal"
      (close)="showModal = false"
    ></app-error-message>
  </mat-card>
</div>
