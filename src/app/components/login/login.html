<div class="login-wrapper">
  <div class="overlay"></div>
  <div *ngIf="loadingInicial" class="loading-container">
    <mat-spinner diameter="50"></mat-spinner>
    <p class="loading-text">Cargando disponibilidad...</p>
  </div>
  <div *ngIf="!loadingInicial">
    <mat-card class="login-card">
      <div class="logo-section">
        <img [src]="empresaLogo" alt="Logo" class="logo">
        <h2>Bienvenido</h2>
        <p>Ingresa a tu cuenta</p>
        <a [routerLink]="['/monitorAgenda', idEmpresa]" class="link-agenda">
          Ver agenda
        </a>
      </div>
      <app-error-message [message]="apiErrorMessage"></app-error-message>
      <form (ngSubmit)="login()" #loginForm="ngForm" autocomplete="off">
        <!-- EMAIL -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Usuario</mat-label>

          <input matInput type="email" name="user_email_{{ uniqueId }}" [(ngModel)]="email" required minlength="4"
            #emailInput="ngModel" autocomplete="off" />

          <mat-icon matPrefix>person</mat-icon>

          <mat-error *ngIf="emailInput.errors?.['required']">
            El usuario es obligatorio
          </mat-error>

          <mat-error *ngIf="emailInput.errors?.['email']">
            Ingresa un usuario válido
          </mat-error>

        </mat-form-field>

        <!-- PASSWORD -->
        <mat-form-field appearance="outline" class="full-width">

          <mat-label>Contraseña</mat-label>

          <input matInput [type]="hidePassword ? 'password' : 'text'" name="user_pass_{{ uniqueId }}"
            [(ngModel)]="password" required minlength="6" #passwordInput="ngModel" />

          <mat-icon matPrefix>lock</mat-icon>

          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>
              {{ hidePassword ? 'visibility_off' : 'visibility' }}
            </mat-icon>
          </button>

          <mat-error *ngIf="passwordInput.errors?.['required']">
            La contraseña es obligatoria
          </mat-error>

        </mat-form-field>

        <!-- BOTÓN -->
        <button mat-raised-button color="primary" class="login-button" [disabled]="loginForm.invalid || loading">

          <span *ngIf="!loading">Ingresar</span>

          <mat-spinner *ngIf="loading" diameter="22" strokeWidth="3">
          </mat-spinner>

        </button>

      </form>

      <div *ngIf="idEmpresa === '1'" class="no-account">
        Registrar cliente

        <a [routerLink]="['/register']" [queryParams]="{ em: idEmpresa, tipo: 'cl' }">
          Aqui!
        </a>
      </div>

      <div class="app-version">
        Versión {{version}}
      </div>

    </mat-card>
  </div>

</div>
