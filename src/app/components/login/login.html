<div class="login-wrapper">
  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <app-error-message [message]="apiErrorMessage"></app-error-message>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required minlength="4" #emailInput="ngModel"
          placeholder="correo@empresa.com" />
        <div *ngIf="emailInput.invalid && emailInput.touched">
          <small *ngIf="emailInput.errors?.['required']">El correo es obligatorio.</small>
          <small *ngIf="emailInput.errors?.['email']">Debe ser un correo válido.</small>
          <small *ngIf="emailInput.errors?.['minlength']">Debe tener al menos 4 caracteres.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required minlength="6"
          #passwordInput="ngModel" placeholder="••••••••" />
        <div *ngIf="passwordInput.invalid && passwordInput.touched">
          <small *ngIf="passwordInput.errors?.['required']">La contraseña es obligatoria.</small>
          <small *ngIf="passwordInput.errors?.['minlength']">Debe tener al menos 6 caracteres.</small>
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading">
        <span *ngIf="!loading">Ingresar</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <div *ngIf="tipo === 'cl'" class="no-account">
      ¿No tienes cuenta?
      <a
        [routerLink]="['/register']"
        [queryParams]="{ em: idEmpresa, tipo: 'cl' }"
      >Crea una</a>
    </div>

    <app-error-message [message]="apiErrorMessage" [show]="showModal" (close)="showModal = false"></app-error-message>
  </div>
</div>
