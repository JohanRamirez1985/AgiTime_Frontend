<h2 class="titulo">
  Disponibilidad para el {{ data.fecha | date: 'fullDate':'':'es' }}
</h2>

<mat-accordion multi class="acordeon">
  <!-- Sección Mañana -->
  <mat-expansion-panel [expanded]="true">
    <mat-expansion-panel-header>
      <mat-panel-title>🕗 Mañana (AM)</mat-panel-title>
    </mat-expansion-panel-header>
    <div class="hora-wrapper">
      <button mat-stroked-button
              *ngFor="let hora of horasAM"
              [ngClass]="hora.disponible ? 'btn-verde' : 'btn-rojo'"
              [disabled]="!hora.disponible"
              (click)="seleccionarHora(hora.hora)">
        {{ hora.hora }}
      </button>
    </div>
  </mat-expansion-panel>

  <!-- Sección Tarde -->
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>🕓 Tarde (PM)</mat-panel-title>
    </mat-expansion-panel-header>
    <div class="hora-wrapper">
      <button mat-stroked-button
              *ngFor="let hora of horasPM"
              [ngClass]="hora.disponible ? 'btn-verde' : 'btn-rojo'"
              [disabled]="!hora.disponible"
              (click)="seleccionarHora(hora.hora)">
        {{ hora.hora }}
      </button>
    </div>
  </mat-expansion-panel>
</mat-accordion>

<!-- Footer del diálogo con botón Cerrar -->
<div class="dialog-footer">
  <button mat-raised-button color="primary" (click)="cerrar()">
    <mat-icon>close</mat-icon> Cerrar
  </button>
</div>
