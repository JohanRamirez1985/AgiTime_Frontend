<div class="modal-backdrop" *ngIf="show">
  <div class="modal classic">
    <div class="modal-header">
      <mat-icon class="icon">error_outline</mat-icon>
      <h3>Error</h3>
    </div>
    <div class="modal-body">{{ message }}</div>
    <div class="modal-footer">
      <button mat-flat-button color="warn" (click)="onClose()">Aceptar</button>
    </div>
  </div>
</div>
