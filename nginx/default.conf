server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Angular app fallback para rutas SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ruta para microservicio Parametros
    location /api/Parametros/ {
        proxy_pass http://parametros-api/api/Parametros/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Ruta para microservicio Usuarios
    location /api/Usuarios/ {
        proxy_pass http://usuarios-api/api/Usuarios/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Ruta para microservicio Clientes
    location /api/Clientes/ {
        proxy_pass http://clientes-api/api/Clientes/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Ruta para microservicio Agendamientos
    location /api/Agendamientos/ {
        proxy_pass http://agendamientos-api/api/Agendamientos/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
